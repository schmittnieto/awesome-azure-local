name: Copy Files to Blog Repository

on:
  push:
    branches:
      - main

# Queue syncs from this repo instead of running them side by side.
concurrency:
  group: copy-to-blog
  cancel-in-progress: false

jobs:
  copy-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v5

      - name: Checkout Destination Repository
        uses: actions/checkout@v5
        with:
          repository: schmittnieto/schmittnieto.github.io
          token: ${{ secrets.GH_PAT }}
          path: blog_destination

      - name: Copy Files
        run: |
          SOURCE_DIR="${{ github.workspace }}"
          DEST_DIR="${{ github.workspace }}/blog_destination/assets/repo/awesome-azure-local"
          mkdir -p "$DEST_DIR"
          rsync -av \
            --exclude='.git' \
            --exclude='blog_destination' \
            "$SOURCE_DIR/" "$DEST_DIR/"

      - name: Commit and Push Changes
        working-directory: blog_destination
        run: |
          git config user.name "schmittnieto"
          git config user.email "cristian@schmitt-nieto.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync Awesome Azure Local into blog assets"

          # Other repos (awesome-azure-virtual-desktop) and the blog's own
          # workflows push to the same branch, so rebase and retry on rejection.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing on the latest main"
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "Push still rejected after 5 attempts"
          exit 1
